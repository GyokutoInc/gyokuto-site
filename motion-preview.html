<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gyokuto motion preview</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #102738;
      --muted: #587086;
      --surface: #f5f8fc;
      --line: #dbe6f2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 7vw, 42px);
      line-height: 1.1;
      letter-spacing: -.04em;
    }

    .intro {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    section {
      margin-top: 28px;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 16px;
      line-height: 1.4;
    }

    .preview {
      width: 100%;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    .preview img {
      display: block;
      width: 100%;
      height: auto;
    }

    .preview--stack {
      max-width: 520px;
      margin-inline: auto;
    }

    @media (max-width: 480px) {
      main {
        width: min(100% - 24px, 760px);
        padding-top: 20px;
      }

      section { margin-top: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Gyokuto motion preview</h1>
    <p class="intro">スマートフォン幅を基準に、素材を一つずつ確認できます。</p>

    <section>
      <h2>積み上げ — four block pillars</h2>
      <div class="preview preview--stack">
        <img src="assets/gyokuto-motion-stack-small.svg" alt="高さの違う4本のブロック柱が積み上がるアニメーション">
      </div>
    </section>

    <section>
      <h2>連続通過 — relay</h2>
      <div class="preview">
        <img src="assets/gyokuto-motion-relay.svg" alt="4本の太いビームが順番に左から右へ通過するアニメーション">
      </div>
    </section>

    <section>
      <h2>通過 — sweep</h2>
      <div class="preview">
        <img src="assets/gyokuto-motion-sweep.svg" alt="一本の大きなビームが左から右へ通過するアニメーション">
      </div>
    </section>

    <section>
      <h2>整列 — align</h2>
      <div class="preview">
        <img src="assets/gyokuto-motion-align.svg" alt="3本のビームが整列するアニメーション">
      </div>
    </section>

    <section>
      <h2>散開 — scatter</h2>
      <div class="preview">
        <img src="assets/gyokuto-motion-scatter.svg" alt="素材が集まり散らばるアニメーション">
      </div>
    </section>
  </main>
</body>
</html>
