<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-labelledby="title desc">
  <title id="title">Gyokuto four block pillars</title>
  <desc id="desc">Four small block pillars rise from one baseline and settle at four different heights.</desc>
  <style>
    :root {
      --gyokuto-violet: #534dff;
      --gyokuto-blue: #8dbbff;
    }

    .stack-block {
      transform-box: fill-box;
      transform-origin: center;
      animation-duration: 760ms;
      animation-timing-function: cubic-bezier(.22, 1, .36, 1);
      animation-iteration-count: 1;
      animation-fill-mode: both;
    }

    .pillar-block {
      animation-name: pillar-block-in;
    }

    @keyframes pillar-block-in {
      0% { opacity: 0; transform: translate3d(0, 96px, 0); }
      100% { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .stack-block { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <defs>
    <symbol id="gx-block" viewBox="0 0 88 92">
      <path d="M44 3 84 25 44 47 4 25Z" fill="currentColor" />
      <path d="M4 25 44 47v42L4 67Z" fill="currentColor" opacity=".46" />
      <path d="m44 47 40-22v42L44 89Z" fill="currentColor" opacity=".78" />
    </symbol>
  </defs>

  <!-- 2段: 左の低い柱 -->
  <g class="stack-block pillar-block" style="color: var(--gyokuto-blue); animation-delay: 80ms">
    <use href="#gx-block" x="20" y="264" width="88" height="92" />
  </g>
  <g class="stack-block pillar-block" style="color: var(--gyokuto-blue); animation-delay: 140ms">
    <use href="#gx-block" x="25" y="220" width="88" height="92" />
  </g>

  <!-- 3段 -->
  <g class="stack-block pillar-block" style="color: var(--gyokuto-violet); animation-delay: 220ms">
    <use href="#gx-block" x="137" y="264" width="88" height="92" />
  </g>
  <g class="stack-block pillar-block" style="color: var(--gyokuto-violet); animation-delay: 280ms">
    <use href="#gx-block" x="132" y="220" width="88" height="92" />
  </g>
  <g class="stack-block pillar-block" style="color: var(--gyokuto-violet); animation-delay: 340ms">
    <use href="#gx-block" x="140" y="176" width="88" height="92" />
  </g>

  <!-- 4段 -->
  <g class="stack-block pillar-block" style="color: var(--gyokuto-blue); animation-delay: 420ms">
    <use href="#gx-block" x="254" y="264" width="88" height="92" />
  </g>
  <g class="stack-block pillar-block" style="color: var(--gyokuto-blue); animation-delay: 480ms">
    <use href="#gx-block" x="260" y="220" width="88" height="92" />
  </g>
  <g class="stack-block pillar-block" style="color: var(--gyokuto-blue); animation-delay: 540ms">
    <use href="#gx-block" x="252" y="176" width="88" height="92" />
  </g>
  <g class="stack-block pillar-block" style="color: var(--gyokuto-blue); animation-delay: 600ms">
    <use href="#gx-block" x="258" y="132" width="88" height="92" />
  </g>

  <!-- 5段: 右の高い柱 -->
  <g class="stack-block pillar-block" style="color: var(--gyokuto-violet); animation-delay: 680ms">
    <use href="#gx-block" x="371" y="264" width="88" height="92" />
  </g>
  <g class="stack-block pillar-block" style="color: var(--gyokuto-violet); animation-delay: 740ms">
    <use href="#gx-block" x="365" y="220" width="88" height="92" />
  </g>
  <g class="stack-block pillar-block" style="color: var(--gyokuto-violet); animation-delay: 800ms">
    <use href="#gx-block" x="375" y="176" width="88" height="92" />
  </g>
  <g class="stack-block pillar-block" style="color: var(--gyokuto-violet); animation-delay: 860ms">
    <use href="#gx-block" x="368" y="132" width="88" height="92" />
  </g>
  <g class="stack-block pillar-block" style="color: var(--gyokuto-violet); animation-delay: 920ms">
    <use href="#gx-block" x="374" y="88" width="88" height="92" />
  </g>
</svg>
